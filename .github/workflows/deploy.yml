name: Deploy public HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-html-maybe404
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy public/ to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a1d3ea71137a0bf339977f85c7cf0029
          command: deploy
