<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tidewatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: no grid of cards. Three stages share one canvas: a rotary feed turning on the right edge, a 24-hour sundial for the day, and a river whose width is coverage and whose playhead you drag through a storyline. A floating dock of three orbs moves between them. */
:root {
  --font-display: "Urbanist", "Hanken Grotesk", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;

  --bg: #E7EDEB;
  --ink: #12201F;
  --muted: #5B6E6B;
  --soft: #8A9C99;
  --glass: rgba(255, 255, 255, .58);
  --surface: #F5F9F8;
  --bead: #FFFFFF;
  --accent: #E4902F;
  --on-tc: #0E1C1D;

  --t-ai: #A863B1;
  --t-chips: #1E9C94;
  --t-energy: #E19B2F;
  --t-policy: #4F7FCC;
  --t-cyber: #E2604E;
  --t-markets: #6BA257;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071214; --ink: #E4EEEC; --muted: #8DA3A0; --soft: #566C69; --glass: rgba(24, 42, 44, .62); --surface: #0E1C1E; --bead: #E4EEEC; --accent: #F2B25C;
    --t-ai: #C58BCB; --t-chips: #4FD1C7; --t-energy: #F0B95C; --t-policy: #7DA6EA; --t-cyber: #F28B7B; --t-markets: #92C97E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071214; --ink: #E4EEEC; --muted: #8DA3A0; --soft: #566C69; --glass: rgba(24, 42, 44, .62); --surface: #0E1C1E; --bead: #E4EEEC; --accent: #F2B25C;
  --t-ai: #C58BCB; --t-chips: #4FD1C7; --t-energy: #F0B95C; --t-policy: #7DA6EA; --t-cyber: #F28B7B; --t-markets: #92C97E;
  color-scheme: dark;
}

@property --wx { syntax: "<percentage>"; inherits: true; initial-value: 70%; }
@property --wy { syntax: "<percentage>"; inherits: true; initial-value: 50%; }
@property --wc { syntax: "<color>"; inherits: true; initial-value: #1E9C94; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { overflow-x: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  overflow-x: hidden; min-height: 100%;
  transition: --wx 1.4s cubic-bezier(.2, .7, .2, 1), --wy 1.4s cubic-bezier(.2, .7, .2, 1), --wc 1.4s ease;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

.wash { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(70vmax 60vmax at var(--wx) var(--wy), color-mix(in srgb, var(--wc) 24%, transparent), transparent 70%); }

.stage {
  position: relative; z-index: 1; --vh: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1480px; margin: 0 auto;
}
.view { position: relative; }
.view.enter { animation: viewIn .7s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px); } }

/* masthead */
.mast { position: fixed; z-index: 5; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none;
  padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mast > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; font: 500 17px/1 var(--font-display); letter-spacing: .01em; }
.brand svg { width: 24px; height: 24px; }
.orbs { display: flex; gap: 14px; align-items: center; }
.to { position: relative; width: 14px; height: 14px; padding: 0; border: 0; border-radius: 50%; background: var(--tc); opacity: .3;
  transition: opacity .3s, box-shadow .3s, transform .3s; }
.to::before { content: ""; position: absolute; inset: -9px; }
.to[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 5px color-mix(in srgb, var(--tc) 22%, transparent); }
.to:hover { transform: scale(1.18); }
.to::after { content: attr(data-tip); position: absolute; top: 24px; right: -4px; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--bg);
  font-size: 12px; font-weight: 500; white-space: nowrap; opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s; pointer-events: none; }
.to:hover::after, .to:focus-visible::after { opacity: 1; transform: none; }

/* dock */
.dock { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 5px;
  border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 14px 40px -14px rgba(10, 30, 30, .35); }
.dk { display: flex; align-items: center; height: 46px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted);
  transition: background .45s cubic-bezier(.3, .9, .3, 1), color .3s; }
.dk svg { width: 22px; height: 22px; flex: none; }
.dk span { max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; font-weight: 500; transition: max-width .5s cubic-bezier(.3, .9, .3, 1), opacity .3s, margin .5s; margin-left: 0; }
.dk:hover { color: var(--ink); }
.dk[aria-current="page"] { background: var(--ink); color: var(--bg); }
.dk[aria-current="page"] span { max-width: 80px; opacity: 1; margin-left: 9px; }

.toast { position: fixed; z-index: 7; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); padding: 8px 18px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.orb { width: 48px; height: 48px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; color: var(--ink);
  background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 10px 28px -12px rgba(10, 30, 30, .35);
  transition: background .35s, color .35s, transform .25s, box-shadow .35s; }
.orb svg { width: 20px; height: 20px; }
.orb:hover { transform: scale(1.07); }
.orb:active { transform: scale(.94); }
.orb[aria-pressed="true"] { background: var(--tc, var(--accent)); color: var(--on-tc); box-shadow: 0 0 0 7px color-mix(in srgb, var(--tc, var(--accent)) 22%, transparent); }

/* NOW: the rotary feed */
.now { height: var(--vh); user-select: none; -webkit-user-select: none; touch-action: none; overflow: visible; cursor: grab; }
.now:active { cursor: grabbing; }
.wheel { position: absolute; inset: 0; }
.band { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.lens { position: absolute; left: 0; top: 0; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--tc) 38%, transparent), transparent 68%); transition: background .8s; }
.n { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none; will-change: transform, opacity; }
.n .d { position: absolute; left: 0; top: 0; width: var(--sz); height: var(--sz); margin: calc(var(--sz) / -2) 0 0 calc(var(--sz) / -2); border-radius: 50%; background: var(--tc);
  box-shadow: 0 0 0 calc(var(--sz) * .32) color-mix(in srgb, var(--tc) 17%, transparent); transition: box-shadow .4s; }
.n.f .d { box-shadow: 0 0 0 calc(var(--sz) * .38) color-mix(in srgb, var(--tc) 28%, transparent), 0 0 34px color-mix(in srgb, var(--tc) 55%, transparent); }
.n .lb { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); white-space: nowrap; max-width: 24vw; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--muted); pointer-events: none; }
.focus { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: min(580px, 46%); pointer-events: none; }
.focus button { pointer-events: auto; }
.when { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tc) 22%, transparent); }
.when b { color: var(--ink); font-weight: 500; }
.focus h1 { font: 300 clamp(32px, 4.4vw, 62px)/1.06 var(--font-display); letter-spacing: -.028em; margin: 20px 0 18px; text-wrap: balance; }
.w { display: inline-block; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(.55em); filter: blur(7px); } }
.focus p { color: var(--muted); font-size: clamp(15px, 1.3vw, 18px); max-width: 46ch; animation: fade .9s .3s both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
.acts { display: flex; align-items: center; gap: 16px; margin-top: 28px; animation: fade .9s .4s both; }
.noanim .w, .noanim p, .noanim .acts { animation: none; }
.story { display: inline-flex; align-items: center; gap: 11px; border: 0; background: none; padding: 0; font-weight: 500; text-align: left; }
.story .o { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--tc) 28%, transparent); transition: transform .4s, background .3s; }
.story svg { width: 15px; height: 15px; transition: transform .4s; }
.story:hover .o { background: var(--tc); }
.story:hover svg { transform: translateX(2px); }

/* DAY: sundial */
.day { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(28px, 6vw, 96px); align-items: center; min-height: var(--vh); padding: 84px 0 104px; }
.ringbox { position: relative; width: min(100%, calc(var(--vh) - 200px), 760px); aspect-ratio: 1; container-type: inline-size; justify-self: center; touch-action: pan-y; }
.ringbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.bead { position: absolute; z-index: 2; border-radius: 50%; border: 0; padding: 0; aspect-ratio: 1; transform: translate(-50%, -50%); background: var(--tc);
  box-shadow: 0 0 0 .9cqw color-mix(in srgb, var(--tc) 22%, transparent);
  transition: left .9s cubic-bezier(.3, .9, .3, 1), top .9s cubic-bezier(.3, .9, .3, 1), width .7s cubic-bezier(.3, .9, .3, 1), opacity .5s, box-shadow .35s, transform .35s; }
.bead.hide { opacity: 0; pointer-events: none; width: 0; }
.bead.dim { opacity: .16; }
.bead.hot { transform: translate(-50%, -50%) scale(1.45); box-shadow: 0 0 0 1.4cqw color-mix(in srgb, var(--tc) 30%, transparent), 0 0 4cqw color-mix(in srgb, var(--tc) 55%, transparent); z-index: 3; }
.ta { fill: none; stroke-width: 3; stroke-linecap: round; transition: opacity .3s, stroke-width .3s; cursor: pointer; }
.ta.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(.3, .8, .3, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.ta.dim { opacity: .18; }
.ringbox .hr { font: 400 2.4px var(--font-body); fill: var(--soft); text-anchor: middle; dominant-baseline: central; }
.hand-halo { animation: halo 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { from { transform: scale(.5); opacity: .5; } to { transform: scale(2.4); opacity: 0; } }
.core { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 1; }
.ci { display: flex; flex-direction: column; align-items: center; gap: 1.2cqw; pointer-events: none; }
.ci button { pointer-events: auto; }
.wk, .mo { font-size: max(12px, 3.6cqw); color: var(--muted); letter-spacing: .04em; }
.nr { display: flex; align-items: center; gap: 2.4cqw; }
.num { font: 200 24cqw/.9 var(--font-display); letter-spacing: -.04em; min-width: 14cqw; text-align: center; }
.roll { animation: roll .6s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes roll { from { opacity: 0; transform: translateY(.18em); filter: blur(6px); } }
.cb { width: 7.6cqw; height: 7.6cqw; min-width: 30px; min-height: 30px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--ink) 7%, transparent); display: grid; place-items: center; color: var(--ink); transition: background .3s, transform .25s; }
.cb:hover { background: color-mix(in srgb, var(--ink) 15%, transparent); transform: scale(1.08); }
.cb:disabled { opacity: .25; pointer-events: none; }
.cb svg { width: 45%; height: 45%; }
.dots { display: flex; gap: 6px; margin-top: .6cqw; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 18%, transparent); transition: width .4s, background .4s; }
.dots i.on { width: 20px; border-radius: 3px; background: var(--ink); }
.dtext { display: flex; flex-direction: column; gap: clamp(26px, 5vh, 48px); min-width: 0; }
.ov { font: 300 clamp(23px, 2.5vw, 34px)/1.28 var(--font-display); letter-spacing: -.015em; text-wrap: pretty; max-width: 26em; }
.mom { display: flex; flex-direction: column; gap: 4px; }
.mom button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 9px 0; border: 0; background: none; text-align: left; transition: transform .35s cubic-bezier(.3, .9, .3, 1), opacity .3s; }
.mom button i { flex: none; width: var(--sz); height: var(--sz); border-radius: 50%; background: var(--tc); box-shadow: 0 0 0 5px color-mix(in srgb, var(--tc) 18%, transparent); margin: 0 5px; }
.mom button span { flex: 1; min-width: 0; font-weight: 500; text-wrap: pretty; }
.mom button time { font-size: 13px; color: var(--soft); font-variant-numeric: tabular-nums; }
.mom button:hover, .mom button.hot { transform: translateX(8px); }
.mom.dim button:not(.hot) { opacity: .4; }

/* THREADS */
.tp { position: relative; padding-top: 84px; }
.pool { position: relative; height: calc(var(--vh) - 188px); min-height: 400px; }
.bub { position: absolute; left: 0; top: 0; padding: 0; border: 0; border-radius: 50%; background: none; transition: transform .8s cubic-bezier(.2, .9, .2, 1), opacity .5s; color: var(--ink); }
.bi { position: relative; width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 34% 26%, color-mix(in srgb, var(--tc) 52%, var(--surface)), color-mix(in srgb, var(--tc) 18%, transparent) 74%);
  animation: breathe var(--bd) ease-in-out infinite; transition: filter .4s; }
.bub:hover .bi { filter: saturate(1.25) brightness(1.04); }
.bi span { padding: 14%; font: 500 var(--fs)/1.18 var(--font-display); text-wrap: balance; letter-spacing: -.005em; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
.bub.tr .bi { box-shadow: 0 0 0 10px color-mix(in srgb, var(--tc) 13%, transparent); }
.bub.tr::after { content: ""; position: absolute; inset: -18px; border-radius: 50%; pointer-events: none; animation: spin 10s linear infinite;
  background: radial-gradient(circle at 50% 6px, var(--accent) 0 4.5px, transparent 5.5px); }
@keyframes spin { to { transform: rotate(360deg); } }
.bub.off { opacity: .2; }
.pf { position: absolute; right: 0; top: 52px; --tc: var(--accent); }

.river { padding: 84px 0 110px; min-height: var(--vh); display: flex; flex-direction: column; }
.rhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
.rhead > div { min-width: 0; }
.back { margin-top: 4px; }
.rhead .mid { flex: 1; display: flex; flex-direction: column; gap: 12px; }
.stat { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); }
.stat i { width: 8px; height: 8px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sc) 22%, transparent); }
.rhead h2 { font: 300 clamp(32px, 4.4vw, 60px)/1.05 var(--font-display); letter-spacing: -.028em; text-wrap: balance; }
.chain { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--soft); }
.chain span { display: inline-flex; align-items: center; gap: 9px; }
.chain i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 15%, transparent); }
.chain .done i { background: var(--tc); }
.chain .cur { color: var(--ink); font-weight: 600; }
.chain .cur i { background: var(--tc); box-shadow: 0 0 0 5px color-mix(in srgb, var(--tc) 26%, transparent); }
.rwrap { position: relative; margin: clamp(20px, 5vh, 56px) -16px 0; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.rwrap:active { cursor: grabbing; }
.rwrap svg { display: block; width: 100%; overflow: visible; }
.rwrap .bd { filter: drop-shadow(0 3px 7px rgba(8, 24, 24, .28)); transition: opacity .3s; }
.rwrap .ph-halo { animation: halo 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.rwrap .ax { font: 400 12px var(--font-body); fill: var(--soft); }
.rtext { margin-top: clamp(18px, 4vh, 40px); max-width: 640px; min-height: 150px; }
.rtext h3 { margin: 14px 0 12px; font: 300 clamp(25px, 3vw, 40px)/1.12 var(--font-display); letter-spacing: -.022em; text-wrap: balance; }
.rtext p { color: var(--muted); font-size: 16px; max-width: 52ch; }

@media (max-width: 900px) {
  .focus { top: 100px; transform: none; width: 100%; }
  .focus h1 { font-size: clamp(30px, 8.4vw, 44px); margin: 16px 0 14px; }
  .n .lb { display: none; }
  .day { grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; padding-top: 84px; }
  .ringbox { width: min(100%, 520px); }
  .rwrap { margin-left: -8px; margin-right: -8px; }
}
@media (max-width: 520px) {
  .dk { padding: 0 12px; }
  .pf { top: 78px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>

<div class="wash" aria-hidden="true"></div>

<header class="mast">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="16.8" cy="8.2" r="2.7" style="fill:var(--accent)"/></svg>Tidewatch</div>
  <div class="orbs" id="orbs" role="group" aria-label="Topics"></div>
</header>

<div class="stage">
  <section class="view now" id="v-now" hidden>
    <div class="wheel" id="wheel">

  </section>
  <section class="view" id="v-day" hidden></section>
  <section class="view" id="v-threads" hidden></section>
</div>

  }
  function dayGo(dir) { var n = clamp(S.day + dir, 0, 6); if (n !== S.day) { S.day = n; updateDay(true); } }
  function hotItem(id) {

  /* ---------- THREADS ---------- */
  var T = { built: false, pos: [], bubs: [] };

  function renderPool() {

  }

  /* river */
  var R = { ev: null, items: [], t: 12.9, W: 0, H: 0, raf: 0, active: -1, refs: null };
  var PAD = 44;
  function tOf(it) { return 13 - it.d + it.h / 24 - 0.5; }
  function xOf(t) { return PAD + t / 13 * (R.W - PAD * 2); }

  function openRiver(id) { S.ev = id; showThreads(); }

  }

    R.ev = e; R.items = items;
    var sc = e.status === 'Escalating' ? 'var(--t-cyber)' : e.status === 'Cooling' ? 'var(--t-markets)' : 'var(--accent)';
    var chain = e.phases.map(function (p, i) { return '<span class="' + (i < e.cur ? 'done' : i === e.cur ? 'cur' : '') + '"><i></i>' + esc(p) + '</span>'; }).join('');
    var river = $('#river');

    river.innerHTML = '<div class="rhead"><button class="orb back" id="rback" aria-label="Back">' + IC.back + '</button><div class="mid"><div class="stat" style="--sc:' + sc + '"><i></i>' + e.status + '</div><h2>' + esc(e.title) + '</h2><div class="chain">' + chain + '</div></div>' +
      '<button class="orb" id="rpin" aria-pressed="' + tr + '" aria-label="' + (tr ? 'Stop tracking' : 'Track') + '">' + IC.pin + '</button></div>' +
      '<div class="rwrap" id="rwrap"></div><div class="rtext" id="rtext"></div>';
    $('#rback').addEventListener('click', closeRiver);

      var on = !S.tracked.has(e.id); setTrack(e.id, on);

      $('#rpin').setAttribute('aria-pressed', on);
    });
    var w = $('#rwrap'), down = false;
    function pt(ev) { var r = w.getBoundingClientRect(); return (ev.clientX - r.left) / r.width * R.W; }

  }
  function drawRiver(reveal) {
    var w = $('#rwrap'); if (!w) return;
    R.W = w.clientWidth; R.H = clamp(window.innerHeight * 0.3, 190, 300);
    var e = R.ev, s = e.series, mx = Math.max.apply(null, s) || 1, W = R.W, H = R.H;

    up.push([W - PAD + 34, ym(13.8)]);
    low.push([W - PAD + 34, ym(13.8)]);

    low.push([PAD - 34, ym(-0.8)]);
    var d = 'M' + up[0][0].toFixed(1) + ' ' + up[0][1].toFixed(1) + cr(up) + cr(low) + 'Z';
    var col = tv(e.topic);
    var beads = R.items.map(function (it, i) {
      var t = tOf(it), r = [0, 5, 7.5, 10.5][it.score];
      return '<circle class="bd" data-i="' + i + '" cx="' + xOf(t).toFixed(1) + '" cy="' + ym(t).toFixed(1) + '" r="' + r + '" style="fill:var(--bead)"/>';
    }).join('');
    var svg = '<svg id="rsvg" viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Coverage over fourteen days. Drag to move through the storyline.">' +
      '<defs><linearGradient id="rg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:' + col + ';stop-opacity:.22"/><stop offset="1" style="stop-color:' + col + ';stop-opacity:.95"/></linearGradient>' +
      '<linearGradient id="rbm" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:' + col + ';stop-opacity:0"/><stop offset=".5" style="stop-color:' + col + ';stop-opacity:.3"/><stop offset="1" style="stop-color:' + col + ';stop-opacity:0"/></linearGradient>' +
      '<filter id="rbl" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>' +
      '<clipPath id="cpP"><rect id="cpPr" x="0" y="-40" width="0" height="' + (H + 80) + '"/></clipPath><clipPath id="cpF"><rect id="cpFr" x="0" y="-40" width="' + W + '" height="' + (H + 80) + '"/></clipPath></defs>' +
      '<g clip-path="url(#cpF)" opacity=".24"><path d="' + d + '" fill="url(#rg)"/></g>' +
      '<g clip-path="url(#cpP)"><path d="' + d + '" fill="url(#rg)" filter="url(#rbl)" opacity=".55"/><path d="' + d + '" fill="url(#rg)"/></g>' +
      '<ellipse id="beam" cx="0" cy="' + (H / 2) + '" rx="26" ry="' + (H * 0.36) + '" fill="url(#rbm)" opacity=".7"/>' + beads +
      '<g id="orb"><circle class="ph-halo" r="14" style="fill:var(--accent)" opacity=".3"/><circle r="7" style="fill:var(--ink)"/></g>' +
      '<text class="ax" x="' + PAD + '" y="' + (H + 6) + '">' + fDm.format(dateOf(13)) + '</text><text class="ax" x="' + (W - PAD) + '" y="' + (H + 6) + '" text-anchor="end">Today</text></svg>';
    w.innerHTML = svg;
    R.refs = { p: $('#cpPr'), f: $('#cpFr'), beam: $('#beam'), orb: $('#orb'), beads: Array.prototype.slice.call(w.querySelectorAll('.bd')) };
    if (reveal && !RM) {
      var g = w.querySelector('svg'); g.style.clipPath = 'inset(0 100% 0 0)'; g.style.transition = 'clip-path 1.5s cubic-bezier(.3,.8,.2,1)';
      requestAnimationFrame(function () { requestAnimationFrame(function () { g.style.clipPath = 'inset(-60px 0 -60px 0)'; }); });

  }
  function setT(t) {

    if (a !== R.active) { R.active = a; renderRText(false); }
  }
  function renderRText() {

    var words = it.title.split(' ').map(function (w, i) { return '<span class="w" style="--i:' + i + '">' + esc(w) + '</span>'; }).join(' ');
    box.innerHTML = '<div class="when" style="--tc:' + tv(R.ev.topic) + '"><i class="tdot"></i><b>' + dayWord(it.d) + ' ' + it.time + '</b><span>' + esc(it.src) + '</span></div><h3>' + words + '</h3><p>' + esc(it.sum) + '</p>';
  }
  function snapRiver() {
    if (!R.items.length) return;
    var best = 0, bd = 1e9; R.items.forEach(function (it, i) { var d = Math.abs(tOf(it) - R.t); if (d < bd) { bd = d; best = i; } });
    var target = tOf(R.items[best]);
    cancelAnimationFrame(R.raf);
    (function go() { var d = target - R.t; if (RM || Math.abs(d) < 0.004) { setT(target); return; } setT(R.t + d * 0.18); R.raf = requestAnimationFrame(go); })();
  }
  function riverStep(dir) {
    var a = R.active + dir; if (a < 0 || a >= R.items.length) return;
    var target = tOf(R.items[a]); cancelAnimationFrame(R.raf);
    (function go() { var d = target - R.t; if (RM || Math.abs(d) < 0.004) { setT(target); return; } setT(R.t + d * 0.2); R.raf = requestAnimationFrame(go); })();
  }

  /* ---------- routing ---------- */
  var first = true;
  function route() {
    var v = view();
    buildDock();
    ['now', 'day', 'threads'].forEach(function (x) {
      var el = $('#v-' + x); el.hidden = x !== v;
      if (x === v) { el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
    });
    window.scrollTo(0, 0);
    if (v === 'now') { var id = S.focusId; S.focusId = null; buildNow(id); }
    else if (v === 'day') { if (!DP.built) buildDay(); updateDay(true); }
    else { if (!T.built) buildThreadsShell(); showThreads(); }
    first = false;
  }
  window.addEventListener('hashchange', route);
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var v = view();
      if (v === 'now') { geo(); paint(); }
      else if (v === 'threads') { if (S.ev) drawRiver(false); else renderPool(); }
      else updateDay(false);
    }, 120);
  });
  document.addEventListener('keydown', function (e) {
    var v = view(), k = e.key;
    if (v === 'now') {
      if (k === 'ArrowDown' || k === 'ArrowRight') { e.preventDefault(); step(1); }
      if (k === 'ArrowUp' || k === 'ArrowLeft') { e.preventDefault(); step(-1); }
    } else if (v === 'day') {
      if (k === 'ArrowLeft') dayGo(1);
      if (k === 'ArrowRight') dayGo(-1);
    } else if (v === 'threads' && S.ev) {
      if (k === 'ArrowLeft') riverStep(-1);

    }
  });

  buildOrbs();
  route();
})();
