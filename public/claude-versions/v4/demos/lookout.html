<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lookout Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky pill-search header over quiet, image-led news cards. Today is a lead row plus masonry; Report and Storylines reuse the same card language. */
:root{
  --bg:#fbfbfa; --surface:#f2f2f0; --surface-2:#e8e8e5; --line:#e4e4e1;
  --ink:#161615; --ink-2:#5d5d59; --ink-3:#8c8c87; --on-ink:#fbfbfa;
  --accent:#1f6f68; --scrim:rgba(20,20,18,.34);
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111110; --surface:#1b1b1a; --surface-2:#262624; --line:#2a2a28;
    --ink:#f2f2f0; --ink-2:#a6a6a1; --ink-3:#77776f; --on-ink:#111110;
    --accent:#5fc2b8; --scrim:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111110; --surface:#1b1b1a; --surface-2:#262624; --line:#2a2a28;
  --ink:#f2f2f0; --ink-2:#a6a6a1; --ink-3:#77776f; --on-ink:#111110;
  --accent:#5fc2b8; --scrim:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
body.has-sheet{overflow:hidden}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{font-family:inherit}
img{display:block}

/* header */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  max-width:1480px;margin:0 auto;padding-block:14px;
  display:grid;grid-template-columns:1fr minmax(300px,560px) 1fr;align-items:center;gap:16px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:30px;min-width:0}
.logo{display:grid;place-items:center;width:34px;height:34px;color:var(--ink);flex:none}
.tabs{display:flex;gap:24px}
.tabs a{color:var(--ink-2);text-decoration:none;font-size:15px;font-weight:500;padding-block:6px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
.search{
  display:flex;align-items:center;gap:10px;height:46px;padding:0 18px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-3);
  transition:background .2s,border-color .2s,box-shadow .2s;
}
.search:focus-within{background:var(--bg);border-color:var(--ink-3);box-shadow:0 8px 28px rgba(0,0,0,.07)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 15px var(--sans);outline:0}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.round{
  justify-self:end;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;
}
.round:hover{background:var(--surface)}
@media (max-width:760px){
  .top{grid-template-columns:1fr auto;grid-template-areas:"brand theme" "search search";gap:10px 12px;padding-block:10px}
  .brand{grid-area:brand;gap:20px}.search{grid-area:search;height:42px}.round{grid-area:theme}
  .tabs{gap:16px}.tabs a{font-size:14px}
}

/* page head */
.main{max-width:1480px;margin:0 auto;padding-block:8px 96px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px;margin:18px 0 22px}
h1{margin:0;font-size:clamp(28px,3.6vw,42px);line-height:1.08;letter-spacing:-.028em;font-weight:500;text-wrap:balance}
.days{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{
  flex:none;width:50px;height:56px;border-radius:15px;border:1px solid var(--line);background:transparent;
  display:grid;place-content:center;gap:3px;cursor:pointer;color:var(--ink);
}
.day small{font:500 10px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.day b{font-weight:500;font-size:16px;line-height:1}
.day:hover{background:var(--surface)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.day[aria-pressed="true"] small{color:var(--on-ink);opacity:.65}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 28px;padding:0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:transparent;font:500 15px var(--sans);color:var(--ink-2);padding:11px 18px;border-radius:999px;cursor:pointer}
.chip:hover{background:var(--surface);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.text-btn{border:0;background:transparent;color:var(--ink-2);font:500 14px var(--sans);cursor:pointer;padding:8px 4px}
.text-btn:hover{color:var(--ink)}
.empty{padding:80px 0;color:var(--ink-2);font-size:16px}

/* media + cards */
.media{position:relative;overflow:hidden;border-radius:14px;background:var(--surface)}
.media img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card,.row,.scard,.entry,.rlead{cursor:pointer}
.card:hover .media img,.row:hover .media img,.scard:hover .media img,.entry:hover .media img,.rlead:hover .media img{transform:scale(1.035)}
.card h3,.row h3,.entry h3{margin:12px 0 5px;font-size:15px;line-height:1.3;font-weight:500;letter-spacing:-.006em;text-wrap:pretty}
h3 a{color:inherit;text-decoration:none}
.card p,.row p,.entry p{
  margin:0;color:var(--ink-2);font-size:13px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.meta{display:flex;align-items:center;gap:8px;margin-top:11px;color:var(--ink-3);font-size:12.5px;min-width:0}
.site{width:30px;height:19px;border-radius:5px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line)}
.meta .src{color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta time{font:400 11.5px var(--mono);white-space:nowrap;flex:none}
.story{
  display:inline-flex;align-items:center;gap:9px;margin-top:11px;max-width:100%;border:0;
  background:var(--surface);color:var(--ink-2);padding:6px 12px 6px 10px;border-radius:999px;
  font:500 12px var(--sans);cursor:pointer;
}
.story:hover{background:var(--surface-2);color:var(--ink)}
.story .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.trail{display:inline-flex;gap:3px;align-items:center;flex:none}
.trail i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.3}
.trail i.on{opacity:.85}
.trail i.now{width:8px;height:8px;background:var(--accent);opacity:1}

.leads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-bottom:48px}
.lead .media{aspect-ratio:4/3;border-radius:20px}
.lead h3{font-size:clamp(19px,1.8vw,24px);line-height:1.2;letter-spacing:-.018em;margin-top:16px}
.lead p{font-size:15px;line-height:1.5;-webkit-line-clamp:4}
.grid{columns:4;column-gap:22px}
.card{break-inside:avoid;margin-bottom:30px;display:block}
@media (max-width:1180px){.grid{columns:3}}
@media (max-width:900px){
  .leads{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .leads::-webkit-scrollbar{display:none}
  .lead{flex:0 0 min(80%,340px);scroll-snap-align:start}
}
@media (max-width:820px){.grid{columns:2;column-gap:12px}.card{margin-bottom:24px}}
@keyframes ring{0%,70%{outline-color:var(--accent)}100%{outline-color:transparent}}
.fresh-card .media{outline:2px solid var(--accent);outline-offset:3px;animation:ring 4s ease forwards}

/* report */
.rhead{display:grid;gap:16px;max-width:900px;margin:18px 0 38px}
.lede{margin:0;font-size:clamp(18px,2vw,22px);line-height:1.5;color:var(--ink-2);letter-spacing:-.01em;text-wrap:pretty}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:64px;align-items:start}
.rside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
@media (max-width:1000px){.rgrid{grid-template-columns:minmax(0,1fr);gap:48px}.rside{position:static}}
.rlead .media{aspect-ratio:16/9;border-radius:22px}
.rlead h2{margin:20px 0 10px;font-size:clamp(24px,3vw,34px);line-height:1.12;letter-spacing:-.022em;font-weight:500;text-wrap:balance}
.rlead p{margin:0;font-size:17px;line-height:1.55;color:var(--ink-2);max-width:62ch}
.sec{margin:52px 0 0;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.rside .sec{margin-top:0}
.row{display:grid;grid-template-columns:172px minmax(0,1fr);gap:22px;padding-block:22px;border-bottom:1px solid var(--line)}
.row .media{aspect-ratio:4/3;border-radius:12px}
.row h3{margin-top:0}
.row p{-webkit-line-clamp:2}
@media (max-width:560px){.row{grid-template-columns:108px minmax(0,1fr);gap:14px}}
.sl{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:18px 0;cursor:pointer}
.sl b{display:block;font-weight:500;font-size:15px;margin-bottom:8px}
.sl .trail{margin-bottom:9px;display:flex}
.sl span.t{display:block;color:var(--ink-2);font-size:13px;line-height:1.45}
.sl:hover b{text-decoration:underline;text-underline-offset:3px}

/* storylines */
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:44px 30px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:22px;overflow:hidden}
.strip .media{border-radius:0;aspect-ratio:3/4}
.scard h3{margin:16px 0 6px;font-size:21px;line-height:1.2;letter-spacing:-.018em;font-weight:500}
.scard p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.smeta{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px;color:var(--ink-3);font-size:12.5px}
.pulse{display:inline-flex;align-items:flex-end;gap:3px;height:20px}
.pulse i{width:4px;border-radius:2px;background:var(--ink-2)}
.pulse i.z{background:var(--line)}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:18px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px}
.back:hover{color:var(--ink)}
.spage{max-width:1000px}
.spage .rhead{margin-block:18px 0}
.timeline{list-style:none;margin:48px 0 0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:116px;top:14px;bottom:30px;width:1px;background:var(--line)}
.tl{display:grid;grid-template-columns:104px 24px minmax(0,1fr);grid-template-areas:"when node entry";padding-bottom:40px}
.when{grid-area:when;text-align:right;padding:2px 14px 0 0}
.when b{display:block;font-weight:500;font-size:14px}
.when time{font:400 12px var(--mono);color:var(--ink-3)}
.when small{display:block;margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.node{grid-area:node;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-3);margin:5px auto 0;position:relative;z-index:1}
.tl:last-child .node{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,transparent)}
.entry{grid-area:entry;display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:22px;padding-left:12px}
.entry .media{aspect-ratio:4/3;border-radius:14px}
.entry h3{margin-top:2px;font-size:19px;line-height:1.25;letter-spacing:-.014em}
.entry p{font-size:14px;-webkit-line-clamp:4}
@media (max-width:700px){
  .timeline::before{left:6px}
  .tl{grid-template-columns:14px minmax(0,1fr);grid-template-areas:"node when" "node entry"}
  .when{text-align:left;padding:0 0 10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .when small{margin:0}
  .node{margin:3px 0 0}
  .entry{grid-template-columns:minmax(0,1fr);gap:0;padding-left:14px}
}

/* detail sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.sheet{
  position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(560px,100%);overflow-y:auto;
  background:var(--bg);border-left:1px solid var(--line);border-radius:26px 0 0 26px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(36px + env(safe-area-inset-bottom,0px)) 22px;
  transform:translateX(36px);opacity:0;visibility:hidden;
  transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .25s,visibility .35s;
}
body.has-sheet .scrim{opacity:1;visibility:visible}
body.has-sheet .sheet{transform:none;opacity:1;visibility:visible}
@media (max-width:640px){.sheet{border-radius:0;border-left:0}}
.close{position:sticky;top:0;float:right;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;margin:0 0 8px 12px}
.close:hover{background:var(--surface-2)}
.sheet .media{aspect-ratio:4/3;border-radius:20px;clear:both}
.sheet h2{margin:22px 0 12px;font-size:27px;line-height:1.15;letter-spacing:-.022em;font-weight:500;text-wrap:balance}
.sheet .sum{margin:0;font-size:16.5px;line-height:1.6;color:var(--ink-2)}
.site-card{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center;margin-top:26px;padding:12px;border:1px solid var(--line);border-radius:18px}
.site-card img{width:132px;aspect-ratio:16/10;object-fit:cover;border-radius:9px;box-shadow:0 0 0 1px var(--line)}
.site-card b{display:block;font-weight:500;font-size:15px}
.site-card span{font:400 12px var(--mono);color:var(--ink-3)}
.sh-story{margin-top:34px}
.sh-name{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;color:var(--ink);font:600 16px var(--sans);cursor:pointer}
.sh-name:hover{text-decoration:underline;text-underline-offset:4px}
.sh-story ol{list-style:none;margin:14px 0 0;padding:0}
.sh-story li button{
  display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;width:100%;text-align:left;border:0;
  border-top:1px solid var(--line);background:transparent;color:var(--ink-2);padding:13px 0;cursor:pointer;font-size:13.5px;line-height:1.4;
}
.sh-story li button:hover{color:var(--ink)}
.sh-story time{font:400 11.5px var(--mono);color:var(--ink-3);padding-top:2px}
.sh-story li.cur button{color:var(--ink);font-weight:500}
.sh-story li.cur time{color:var(--accent)}

/* arrival pill */
.fresh{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);z-index:35;
  display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;border:0;
  background:var(--ink);color:var(--on-ink);font:500 13.5px var(--sans);cursor:pointer;
  box-shadow:0 12px 32px rgba(0,0,0,.2);
  transform:translate(-50%,-10px);opacity:0;visibility:hidden;transition:transform .35s,opacity .3s,visibility .3s;
}
.fresh.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--on-ink)}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
  .fresh-card .media{outline:0}
}
</style>

    var gap=i?a[i-1].d-it.d:0;
    h+='<li class="tl"><div class="when"><b>'+dShort(it.d)+'</b><time>'+it.t+'</time>'+(gap>0?'<small>+'+gap+(gap===1?' day':' days')+'</small>':'')+'</div><i class="node"></i>'
    +'<article class="entry'+(it.id===S.fresh?' fresh-card':'')+'" data-open="'+it.id+'"><div class="media"><img src="'+art(it.id,4/3)+'" alt=""></div><div><h3><a href="#" data-open="'+it.id+'">'+esc(it.title)+'</a></h3><p>'+esc(it.sum)+'</p>'+meta(it)+'</div></article></li>';
  });
  return h+'</ol></div>';
}
function render(keep){
  var html=V==='report'?viewReport():V==='storylines'?viewStorylines():V==='story'?viewStory():viewToday();
  $('#app').innerHTML=html;
  if(keep){var el=$('#app [data-'+keep[0]+'="'+keep[1]+'"]');if(el)el.focus({preventScroll:true})}
}

/* ---------- detail sheet ---------- */
var sheet=$('#sheet'),lastFocus=null;
function sheetHtml(it){
  var h='<button class="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
  h+='<div class="media"><img src="'+art(it.id,4/3)+'" alt=""></div><h2>'+esc(it.title)+'</h2><p class="sum">'+esc(it.sum)+'</p>';
  h+='<div class="site-card"><img src="'+site(it.src)+'" alt=""><div><b>'+esc(it.src)+'</b><span>'+dShort(it.d)+' · '+it.t+'</span></div></div>';
  if(it.story){
    var a=byStory(it.story);
    h+='<div class="sh-story"><button class="sh-name" data-story="'+it.story+'">'+esc(STORIES[it.story].name)+'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></button><ol>'
    +a.map(function(e){return '<li class="'+(e.id===it.id?'cur':'')+'"><button data-open="'+e.id+'"><time>'+dShort(e.d)+'</time><span>'+esc(e.title)+'</span></button></li>'}).join('')+'</ol></div>';
  }
  return h;
}
function openItem(id){
  var it=ITEMS.filter(function(x){return x.id===id})[0];if(!it)return;
  if(!document.body.classList.contains('has-sheet'))lastFocus=document.activeElement;
  sheet.innerHTML=sheetHtml(it);sheet.scrollTop=0;
  document.body.classList.add('has-sheet');sheet.inert=false;sheet.setAttribute('aria-hidden','false');
  var c=sheet.querySelector('.close');if(c)c.focus({preventScroll:true});
}
function closeSheet(){
  if(!document.body.classList.contains('has-sheet'))return;
  document.body.classList.remove('has-sheet');sheet.inert=true;sheet.setAttribute('aria-hidden','true');
  if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});
}

/* ---------- routing ---------- */
function route(){
  var h=location.hash.replace('#','');
  if(h.indexOf('story-')===0&&STORIES[h.slice(6)]){V='story';S.story=h.slice(6)}
  else if(h==='report')V='report';
  else if(h==='storylines')V='storylines';
  else V='today';
  var cur=V==='story'?'storylines':V;
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'),function(a){if(a.dataset.nav===cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- storyline matching and arrival ---------- */
function match(it){
  var text=(it.title+' '+it.sum).toLowerCase(),best=null,bs=1;
  Object.keys(STORIES).forEach(function(id){
    var n=STORIES[id].keys.filter(function(k){return text.indexOf(k)>-1}).length;
    if(n>bs){bs=n;best=id}
  });
  return best;
}
function arrive(){
  $('#fresh').classList.remove('show');
  var it=Object.assign({},INCOMING);it.story=match(it);ITEMS.push(it);
  S.fresh=it.id;S.day=0;S.cat='All';S.q='';input.value='';
  closeSheet();
  var go=it.story?'#story-'+it.story:'#today';
  if(location.hash===go)route();else location.hash=go;
  setTimeout(function(){S.fresh=null;Array.prototype.forEach.call(document.querySelectorAll('.fresh-card'),function(e){e.classList.remove('fresh-card')})},4400);
}
setTimeout(function(){$('#fresh').classList.add('show')},9000);

/* ---------- events ---------- */
var input=$('#q');
input.addEventListener('input',function(){
  S.q=input.value;
  if(V!=='today'){if(location.hash==='#today'||location.hash===''){V='today';render()}else location.hash='#today'}
  else render();
});
document.addEventListener('click',function(e){
  var t=e.target,el;
  if(!t.closest)return;
  if(t.id==='scrim'){closeSheet();return}
  if(t.closest('.close')){closeSheet();return}
  if(t.closest('#fresh')){arrive();return}
  if((el=t.closest('[data-story]'))){e.preventDefault();closeSheet();var go='#story-'+el.dataset.story;if(location.hash===go)route();else location.hash=go;return}
  if((el=t.closest('[data-open]'))){e.preventDefault();openItem(el.dataset.open);return}
  if((el=t.closest('[data-day]'))){S.day=+el.dataset.day;render(['day',el.dataset.day]);return}
  if((el=t.closest('[data-cat]'))){S.cat=el.dataset.cat;render(['cat',el.dataset.cat]);return}
  if(t.closest('[data-clear]')){S.q='';input.value='';render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

/* theme */
var root=document.documentElement;
try{var th=localStorage.getItem('lookout-theme');if(th==='dark'||th==='light')root.dataset.theme=th}catch(err){}
$('#theme').addEventListener('click',function(){
  var dark=root.dataset.theme?root.dataset.theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  var n=dark?'light':'dark';root.dataset.theme=n;
  try{localStorage.setItem('lookout-theme',n)}catch(err){}
});

/* rotating placeholder */
var hints=['Kestrel Strait','chip licensing','battery storage','Halcyon Bank','bond yields'],hi=0;
setInterval(function(){if(document.activeElement===input||input.value)return;hi=(hi+1)%hints.length;input.placeholder='Try ‘'+hints[hi]+'’'},4200);

route();
})();
</script>

</body></html>
