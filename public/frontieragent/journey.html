<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FrontierAgent 全流程动画</title>
<meta name="description" content="一部连续的全屏动画：跟着一个问题走完 FrontierAgent 的十二站，从进门、拆题、派发、取证，到终审、加引用、交付。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#07090D;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;outline:none}
</style>
</head>
<body>
<canvas id="cv" tabindex="0" role="img" aria-label="FrontierAgent 全流程动画。点击或按空格暂停，左右方向键快进快退，PageUp 和 PageDown 切换站点，F 键全屏。"></canvas>
<script id="app">
(() => {
'use strict';
const W = 1920, H = 1080;
const C = {
  ground:'#07090D', hair:'#1A202B', hair2:'#2A3344', line:'#3B4559',
  text:'#E7EBF3', muted:'#98A1B5', faint:'#6F788D',
  llm:'#A7B0F6', llmInk:'#CDD2FB', code:'#7CC4E4', codeInk:'#B6DEEF', sand:'#DDB079', sandInk:'#EDCFA4'
};
const F = {
  serif:(s,w=600)=>`${w} ${s}px "Noto Serif SC","Songti SC",serif`,
  sans:(s,w=400)=>`${w} ${s}px "Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif`,
  mono:(s,w=400)=>`${w} ${s}px "IBM Plex Mono","Noto Sans SC",Menlo,monospace`,
  disp:(s,it=false)=>`${it?'italic ':''}400 ${s}px "Newsreader","Noto Serif SC",Georgia,serif`
};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const H2=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(h,a)=>{const[r,g,b]=H2(h);return`rgba(${r},${g},${b},${a})`;};
const mix=(h1,h2,k)=>{const a=H2(h1),b=H2(h2);return`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')})`;};
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let dirty=true;

/* ---------- primitives ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  r=Math.min(r,w/2,h/2);
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function T(s,x,y,o={}){
  if((o.a??1)<=0)return;
  ctx.save();ctx.globalAlpha*=(o.a??1);
  ctx.font=o.f||F.sans(24);ctx.fillStyle=o.c||C.text;
  ctx.textAlign=o.al||'left';ctx.textBaseline=o.bl||'alphabetic';
  if('letterSpacing' in ctx)ctx.letterSpacing=(o.ls||0)+'px';
  ctx.fillText(s,x,y);ctx.restore();
}
function mw(s,f){ctx.save();ctx.font=f;if('letterSpacing' in ctx)ctx.letterSpacing='0px';const w=ctx.measureText(s).width;ctx.restore();return w;}
function TR(parts,x,y,f,a=1){
  if(a<=0)return 0;
  ctx.save();ctx.globalAlpha*=a;ctx.font=f;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  if('letterSpacing' in ctx)ctx.letterSpacing='0px';
  let cx=x;for(const[s,c]of parts){ctx.fillStyle=c;ctx.fillText(s,cx,y);cx+=ctx.measureText(s).width;}
  ctx.restore();return cx-x;
}
function sup(base,ex,x,y,size,c,it=true){
  const f=F.disp(size,it),fe=F.disp(Math.round(size*.52),it);
  T(base,x,y,{f,c});const w=mw(base,f);T(ex,x+w+size*.04,y-size*.42,{f:fe,c});return w+mw(ex,fe)+size*.04;
}
const glowCache={};
function glowSprite(c){
  if(glowCache[c])return glowCache[c];
  const s=document.createElement('canvas');s.width=s.height=128;const g=s.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,rgba(c,1));gr.addColorStop(.16,rgba(c,.55));gr.addColorStop(.45,rgba(c,.12));gr.addColorStop(1,rgba(c,0));
  g.fillStyle=gr;g.fillRect(0,0,128,128);return glowCache[c]=s;
}
function glow(x,y,r,c,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.globalCompositeOperation='lighter';ctx.drawImage(glowSprite(c),x-r,y-r,r*2,r*2);ctx.restore();}
function dot(x,y,r,c,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();}
function ring(x,y,r,c,a=1,w=1.4){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore();}
function packet(x,y,c,a=1,r=5){glow(x,y,r*6,c,.85*a);dot(x,y,r,'#F4F6FB',a);}
function line(x1,y1,x2,y2,o={}){
  if((o.a??1)<=0)return;
  ctx.save();ctx.globalAlpha*=(o.a??1);ctx.strokeStyle=o.c||C.line;ctx.lineWidth=o.w||1.5;ctx.lineCap='round';
  if(o.dash)ctx.setLineDash(o.dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function tip(x,y,ang,c,s=11){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(1,0);ctx.lineTo(-s,-s*.48);ctx.lineTo(-s*.7,0);ctx.lineTo(-s,s*.48);ctx.closePath();ctx.fill();ctx.restore();}
function arrow(x1,y1,x2,y2,o={}){
  const u=o.p??1;if(u<=0||(o.a??1)<=0)return;
  const x=lerp(x1,x2,u),y=lerp(y1,y2,u);
  ctx.save();ctx.globalAlpha*=(o.a??1);line(x1,y1,x,y,o);tip(x,y,Math.atan2(y2-y1,x2-x1),o.c||C.line);ctx.restore();
}
function cub(a,b,c,d,n=40){const p=[];for(let i=0;i<=n;i++){const t=i/n,m=1-t;p.push([m*m*m*a[0]+3*m*m*t*b[0]+3*m*t*t*c[0]+t*t*t*d[0],m*m*m*a[1]+3*m*m*t*b[1]+3*m*t*t*c[1]+t*t*t*d[1]]);}return p;}
function route(pts,r=22){
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const[px,py]=pts[i-1],[x,y]=pts[i],[nx,ny]=pts[i+1];
    const d1=Math.hypot(x-px,y-py),d2=Math.hypot(nx-x,ny-y),q=Math.min(r,d1/2,d2/2);
    const a=[x+(px-x)/d1*q,y+(py-y)/d1*q],b=[x+(nx-x)/d2*q,y+(ny-y)/d2*q];
    for(let k=0;k<=16;k++){const t=k/16,m=1-t;out.push([m*m*a[0]+2*m*t*x+t*t*b[0],m*m*a[1]+2*m*t*y+t*t*b[1]]);}
  }
  out.push(pts[pts.length-1]);return out;
}
function PL(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,len:L[L.length-1]};}
function plAt(pl,u){
  const d=cl(u)*pl.len;let i=1;while(i<pl.pts.length-1&&pl.L[i]<d)i++;
  const a=pl.pts[i-1],b=pl.pts[i],k=(d-pl.L[i-1])/((pl.L[i]-pl.L[i-1])||1);
  return[lerp(a[0],b[0],k),lerp(a[1],b[1],k),Math.atan2(b[1]-a[1],b[0]-a[0])];
}
function drawPL(pl,u0,u1,o={}){
  if(u1<=u0||(o.a??1)<=0)return;
  ctx.save();ctx.globalAlpha*=(o.a??1);ctx.strokeStyle=o.c||C.line;ctx.lineWidth=o.w||1.5;ctx.lineCap='round';ctx.lineJoin='round';
  if(o.dash)ctx.setLineDash(o.dash);
  const d0=u0*pl.len,d1=u1*pl.len,s=plAt(pl,u0),e=plAt(pl,u1);
  ctx.beginPath();ctx.moveTo(s[0],s[1]);
  for(let i=1;i<pl.pts.length-1;i++){if(pl.L[i]>d0&&pl.L[i]<d1)ctx.lineTo(pl.pts[i][0],pl.pts[i][1]);}
  ctx.lineTo(e[0],e[1]);ctx.stroke();ctx.setLineDash([]);
  if(o.head)tip(e[0],e[1],e[2],o.c||C.line);
  ctx.restore();
}
const KC={llm:C.llm,code:C.code,fb:C.sand,n:C.hair2,ghost:C.faint};
function box(cx,cy,w,h,o={}){
  const a=o.a??1;if(a<=0)return;
  const k=o.k||'n',col=KC[k],s=o.s??1,r=o.r??14;
  ctx.save();ctx.globalAlpha*=a;
  if(s!==1){ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy);}
  const x=cx-w/2,y=cy-h/2;
  if(o.glow>0){glow(cx,cy,Math.max(w,h)*.9,k==='n'?C.text:col,.22*o.glow);}
  rr(x,y,w,h,r);
  ctx.fillStyle=o.fill||(k==='n'||k==='ghost'?'rgba(14,18,26,.92)':mix('#0B0E15',col,.09));ctx.fill();
  if(k==='ghost')ctx.setLineDash([6,6]);
  ctx.strokeStyle=o.st||(k==='n'?C.hair2:k==='ghost'?C.line:rgba(col,.85));ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);
  if(o.glow>0&&k!=='n'){ctx.save();ctx.globalAlpha*=o.glow;ctx.shadowColor=col;ctx.shadowBlur=24;ctx.strokeStyle=col;ctx.lineWidth=1.6;rr(x,y,w,h,r);ctx.stroke();ctx.restore();}
  const lc=o.lc||(k==='llm'?C.llmInk:k==='code'?C.codeInk:k==='fb'?C.sandInk:C.text);
  if(o.label)T(o.label,cx,o.ly??(o.sub?cy-4:cy+8),{f:o.lf||F.sans(24,600),c:lc,al:'center'});
  if(o.sub)T(o.sub,cx,o.sy??(cy+25),{f:o.sf||F.sans(18),c:o.sc||C.muted,al:'center'});
  ctx.restore();
}
function pill(x,y,s,o={}){
  const a=o.a??1;
  ctx.save();ctx.font=o.f||F.sans(20);if('letterSpacing' in ctx)ctx.letterSpacing='0px';
  const px=o.px??16,h=o.h??40,w=ctx.measureText(s).width+px*2;
  if(a<=0){ctx.restore();return w;}
  ctx.globalAlpha*=a;
  const xx=o.al==='center'?x-w/2:o.al==='right'?x-w:x;
  rr(xx,y-h/2,w,h,h/2);
  ctx.fillStyle=o.bg||'rgba(14,18,26,.92)';ctx.fill();
  if(o.st!==null){if(o.dash)ctx.setLineDash(o.dash);ctx.strokeStyle=o.st||C.hair2;ctx.lineWidth=1.3;ctx.stroke();ctx.setLineDash([]);}
  ctx.fillStyle=o.c||C.text;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(s,xx+px,y+1);
  ctx.restore();return w;
}
function docGlyph(cx,cy,w,h,a=1,lines=6){
  if(a<=0)return;
  const x=cx-w/2,y=cy-h/2,f=20;
  ctx.save();ctx.globalAlpha*=a;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w-f,y);ctx.lineTo(x+w,y+f);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();
  ctx.fillStyle='#0E121A';ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.4;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w-f,y);ctx.lineTo(x+w-f,y+f);ctx.lineTo(x+w,y+f);ctx.stroke();
  ctx.fillStyle=rgba(C.muted,.38);
  for(let i=0;i<lines;i++){const lw=(w-34)*(i%3===2?.55:.9);ctx.fillRect(x+17,y+34+i*((h-50)/lines),lw,3);}
  ctx.restore();
}
/* ---------- extra primitives ---------- */
const NOBREAK='，。、；：？！”）》」%';
function wrap(s,f,maxW){
  ctx.save();ctx.font=f;if('letterSpacing' in ctx)ctx.letterSpacing='0px';
  const out=[];let ln='';
  for(const ch of s){
    const tl=ln+ch;
    if(ctx.measureText(tl).width>maxW&&ln&&!NOBREAK.includes(ch)){out.push(ln);ln=ch;}else ln=tl;
  }
  if(ln)out.push(ln);ctx.restore();return out;
}
function TW(s,x,y,maxW,o={}){
  const f=o.f||F.sans(22),size=+f.match(/(\d+)px/)[1],lh=o.lh||Math.round(size*1.55);
  const ls=wrap(s,f,maxW);ls.forEach((l,i)=>T(l,x,y+i*lh,{...o,f}));return ls.length;
}
function folder(x,y,c,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=c;ctx.lineWidth=1.8;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-22,y-15);ctx.lineTo(x-8,y-15);ctx.lineTo(x-3,y-9);ctx.lineTo(x+22,y-9);ctx.lineTo(x+22,y+16);ctx.lineTo(x-22,y+16);ctx.closePath();ctx.stroke();ctx.restore();}
function lock(x,y,c,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=c;ctx.lineWidth=1.8;rr(x-9,y-3,18,15,3);ctx.stroke();ctx.beginPath();ctx.arc(x,y-3,6,Math.PI,0);ctx.stroke();ctx.restore();}
function strike(x,y,w,p,c=C.sand,a=1){if(p<=0)return;line(x-4,y,x-4+(w+8)*p,y,{c,w:2.2,a});}
function chip(x,y,s,kind,a=1,o={}){
  const col=kind==='llm'?C.llm:kind==='code'?C.code:kind==='fb'?C.sand:C.line;
  const ink=kind==='llm'?C.llmInk:kind==='code'?C.codeInk:kind==='fb'?C.sandInk:C.muted;
  return pill(x,y,s,{f:o.f||F.sans(21),h:o.h||44,px:o.px||18,al:o.al,a,c:o.c||ink,st:rgba(col,.6),bg:o.bg||(kind==='n'?'rgba(14,18,26,.92)':mix('#0B0E15',col,.08))});
}
function panel(x,y,w,h,a=1,o={}){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;rr(x,y,w,h,o.r||18);ctx.fillStyle=o.bg||'rgba(12,15,22,.9)';ctx.fill();
  if(o.dash)ctx.setLineDash(o.dash);ctx.strokeStyle=o.st||C.hair2;ctx.lineWidth=1.3;ctx.stroke();ctx.restore();
}
function hdr(t,no,title,gist){
  const a1=eo(seg(t,.15,.8)),a2=eo(seg(t,.3,1.05)),a3=eo(seg(t,.6,1.4));
  T(no,-860,-392,{f:F.disp(66,true),c:C.llm,a:a1});
  T(title,-756,-398+(1-a2)*14,{f:F.serif(52,700),a:a2});
  T(gist,-756,-346,{f:F.sans(24),c:C.muted,a:a3});
}
function scribble(x,y,w,t,a){
  ctx.save();ctx.globalAlpha*=a*.6;ctx.strokeStyle=C.faint;ctx.lineWidth=1.3;
  for(let i=0;i<2;i++){ctx.beginPath();for(let k=0;k<=w;k+=4){const yy=y+i*16+Math.sin(k*.12+i*2+t*1.5)*3;k?ctx.lineTo(x+k,yy):ctx.moveTo(x+k,yy);}ctx.stroke();}
  ctx.restore();
}

/* ================================================================
   STATION SCENES — local coordinates, (0,0) is the station centre.
   Content stays inside x∈[-880,880], y∈[-420,310]; the band below
   is reserved for the subtitles.
   ================================================================ */

const QUESTION='某公司 2024 财年营收多少、同比增长多少、全球市场份额多少？请写一份带来源的报告。';

/* 01 — entry & sandbox */
function P1(t){
  hdr(t,'01','进门：终端与沙箱','选好工作模式，再建一个隔离的工作环境');
  const ta=eo(seg(t,.5,1.2));
  panel(-860,-280,660,420,ta,{bg:'#0C1017'});
  ctx.save();ctx.globalAlpha*=ta;
  [0,1,2].forEach(i=>dot(-830+i*22,-254,5,C.hair2));
  T('终端界面',-530,-247,{f:F.sans(18),c:C.faint,al:'center'});
  line(-860,-228,-200,-228,{c:C.hair2,w:1});
  const n=Math.floor(QUESTION.length*seg(t,1.3,5));
  T('›',-832,-176,{f:F.sans(26,600),c:C.llm});
  const ls=wrap(QUESTION.slice(0,n),F.sans(25),580);
  ls.forEach((l,i)=>T(l,-806,-176+i*40,{f:F.sans(25)}));
  if(n<QUESTION.length&&t>1.2&&Math.floor(t*2.6)%2===0){const li=Math.max(0,ls.length-1);ctx.fillStyle=C.text;ctx.fillRect(-806+mw(ls[li]||'',F.sans(25))+3,-176-22+li*40,2,26);}
  T('选择工作模式',-832,-40,{f:F.sans(19),c:C.faint,a:eo(seg(t,5,5.6))});
  [['单智能体','一个智能体从头做到尾'],['智能体团队','协调者带着一群子智能体分工']].forEach((m,i)=>{
    const a=eo(seg(t,5.2+i*.2,5.8+i*.2)),y=14+i*62,sel=i===1&&t>6.4;
    if(sel)glow(-815,y-8,46,C.llm,.45);
    ring(-815,y-8,10,sel?C.llm:C.line,a,1.6);
    if(sel)dot(-815,y-8,5.5,C.llm,a);
    T(m[0],-790,y,{f:F.sans(24,sel?600:400),c:sel?C.llmInk:C.muted,a});
    T(m[1],-790+mw(m[0],F.sans(24,600))+18,y,{f:F.sans(19),c:C.faint,a});
  });
  ctx.restore();

  const sa=eo(seg(t,6.8,7.6));
  panel(40,-290,840,580,sa,{bg:mix('#0A0D13',C.code,.04),st:rgba(C.code,.55),dash:[8,8],r:24});
  T('任务沙箱',80,-236,{f:F.serif(30,600),c:C.codeInk,a:sa});
  T('每个任务一个隔离的文件系统',234,-238,{f:F.sans(20),c:C.muted,a:sa});
  const DR=[['输入区','/inputs','只读：放用户给的材料',true],['工作区','/workspace','研究和计算的中间文件'],['交付区','/outputs','只放最终成果，写入需要授权']];
  DR.forEach((d,i)=>{
    const a=eo(seg(t,7.6+i*.5,8.2+i*.5)),y=-150+i*108;
    panel(76,y-42,768,84,a,{r:14});
    folder(122,y,C.code,a);
    T(d[0],166,y-2,{f:F.sans(26,600),a});
    T(d[1],166,y+26,{f:F.mono(17),c:C.faint,a});
    T(d[2],818,y+8,{f:F.sans(21),c:C.muted,al:'right',a});
    if(d[3])lock(270,y-10,C.muted,a);
  });
  const fu=seg(t,7,8.4);
  if(fu>0&&fu<1){const p=PL(cub([-200,-60],[-60,-160],[120,-60],[460,-44]));const[x,y]=plAt(p,eio(fu));packet(x,y,C.llm,1,7);}
  if(t>=8.4){const pa=1-seg(t,8.4,9.4);glow(460,-44,120,C.llm,.5*pa);}
  const na=eo(seg(t,12.6,13.3));
  dot(84,219,5,C.sand,na);
  TR([['沙箱建不起来、权限验证失败',C.sandInk],['  →  直接中止，绝不退回无隔离的环境',C.muted]],102,227,F.sans(21),na);
}

/* 02 — the coordinator thinks first */
const THINK=[['到底在问什么','营收、同比增长、全球份额，三件事'],['问题分几层','先查到原始数字，再算增长幅度'],['拆成哪些小问题','每一个都能单独检查对错'],['正确答案长什么样','三个精确数字，每个都有可靠来源'],['最后交付什么','一份报告文件，不多不少']];
function P2(t){
  hdr(t,'02','协调者：先想清楚，再动手','只拆题，不求解');
  const cx=-640,cy=-80,ca=eo(seg(t,.5,1.2));

    if(i<ST.length-1&&t<s.start+s.D+TRD)return{i,ph:'tr',u:(t-s.start-s.D)/TRD};

function camOf(i){const s=ST[i];return s.ov?{x:OV.x,y:OV.y,s:OV.s}:{x:s.p[0],y:s.p[1],s:1};}
function camera(w){
  if(w.ph==='stay'){

    return{...c,arc:ST[w.i].arc??(w.i===0?0:ROUTE.len)};
  }
  const A=ST[w.i],B=ST[w.i+1],e=eio(w.u);
  if(!A.ov&&!B.ov){
    const arc=lerp(A.arc,B.arc,e),[x,y]=plAt(ROUTE,arc/ROUTE.len);

  const k=(1/s-1/ca.s)/((1/cb.s-1/ca.s)||1);
  return{x:lerp(ca.x,cb.x,k),y:lerp(ca.y,cb.y,k),s,arc:A.ov?0:ROUTE.len};
}

function frame(t){
  const w=where(t),cam=camera(w);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=C.ground;ctx.fillRect(0,0,PW,PH);
  // stars, gentle parallax
  STARS.forEach((s,i)=>{
    const px=((s.x*PW-cam.x*.02*s.d*K2)%PW+PW)%PW,py=((s.y*PH-cam.y*.02*s.d*K2)%PH+PH)%PH;
    ctx.globalAlpha=s.a*(.65+.35*Math.sin(t*.8+i));ctx.fillStyle='#C9D2EA';ctx.beginPath();ctx.arc(px,py,s.r*K2*1.4,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  // world transform
  const S=K2*cam.s;
  ctx.setTransform(S,0,0,S,OX+K2*960-cam.x*S,OY+K2*540-cam.y*S);
  // world dot grid
  let sp=120;while(sp*S<26)sp*=2;
  const x0=cam.x-(OX+K2*960)/S,x1=cam.x+(PW-OX-K2*960)/S,y0=cam.y-(OY+K2*540)/S,y1=cam.y+(PH-OY-K2*540)/S;
  ctx.fillStyle=rgba('#9AA6C8',.07);const ds=1.6/S;
  for(let gx=Math.floor(x0/sp)*sp;gx<=x1;gx+=sp)for(let gy=Math.floor(y0/sp)*sp;gy<=y1;gy+=sp)ctx.fillRect(gx-ds/2,gy-ds/2,ds,ds);
  // route & emblems when zoomed out
  const ea=cl((.86-cam.s)/.3);
  let prog=cam.arc/ROUTE.len,lit=12;
  if(w.ph==='stay'&&w.i===0){prog=eio(seg(w.lt,8.8,12.6));}
  if(ea>0){
    drawRoute(prog,ea,t);
    const cur=w.ph==='stay'?w.i:(w.u<.5?w.i:w.i+1);
    ST.forEach((s,i)=>{if(!s.p)return;let st=s.arc<=prog*ROUTE.len+1?1:0;if(i===cur&&!ST[cur].ov)st=2;if(w.i===ST.length-1&&w.ph==='stay')st=1;emblem(i,st,ea,t);});
    if(w.ph==='tr'&&!ST[w.i].ov&&!ST[w.i+1].ov){glow(cam.x,cam.y,300,C.llm,.9*ea);dot(cam.x,cam.y,34,'#F4F6FB',ea);}
    if(w.ph==='stay'&&w.i===ST.length-1){
      MECH.forEach(([si,txt,c],j)=>{const a=eo(seg(w.lt,5+j*.55,5.8+j*.55))*(1-eo(seg(w.lt,11.6,12.4)));const[x,y]=ST[si].p;T(txt,x,y-300,{f:F.serif(128,600),c,al:'center',a});});
    }
  }
  // station scene
  const sa=cl((cam.s-.66)/.28);
  if(sa>0){
    let i=-1,lt=0;
    if(w.ph==='stay'&&!ST[w.i].ov){i=w.i;lt=w.lt;}
    else if(w.ph==='tr'&&w.u<.5&&!ST[w.i].ov){i=w.i;lt=ST[w.i].d;}
    if(i>=0){
      const s=ST[i];
      ctx.save();ctx.translate(s.p[0],s.p[1]);ctx.globalAlpha=sa*(w.ph==='stay'?eo(seg(w.raw,0,.6)):1);
      s.draw(lt);
      ctx.restore();
    }
  }
  // screen space
  ctx.setTransform(K2,0,0,K2,OX,OY);ctx.globalAlpha=1;
  if(w.ph==='stay'&&w.i===0)O0(w.lt);
  if(w.ph==='stay'&&w.i===ST.length-1)O13(w.lt);
  minimap(w,cam);
  transitionLabel(w);
  subtitles(w);
  progress(t);
  if(!playing&&started&&t<TOTAL-.05){
    ctx.fillStyle='rgba(7,9,13,.55)';rr(960-120,40,240,52,26);ctx.fill();
    T('已暂停 · 空格继续',960,74,{f:F.sans(20),c:C.text,al:'center'});
  }
  if(hintUntil>t&&started){const a=1-seg(t,hintUntil-1,hintUntil);T('空格 暂停　← → 快退 / 快进　PageUp / PageDown 换站　F 全屏',1880,1050,{f:F.sans(17),c:C.faint,al:'right',a:a*.9});}
  if(!started&&reduce){
    ctx.fillStyle='rgba(7,9,13,.4)';ctx.fillRect(-2000,-2000,W+4000,H+4000);
    ctx.save();ctx.beginPath();ctx.arc(960,540,48,0,Math.PI*2);ctx.fillStyle='rgba(12,15,22,.8)';ctx.fill();ctx.strokeStyle='rgba(231,235,243,.35)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(948,520);ctx.lineTo(978,540);ctx.lineTo(948,560);ctx.closePath();ctx.fillStyle=C.text;ctx.fill();ctx.restore();
    T('点击开始',960,630,{f:F.sans(22),c:C.muted,al:'center'});
  }
}

/* ---------- playback ---------- */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=0,playing=false,started=false,last=performance.now(),speed=1,hintUntil=7;
function setPlaying(v){if(v&&t>=TOTAL-.05)t=0;if(v)started=true;playing=v;last=performance.now();dirty=true;}
function seek(x){t=cl(x,0,TOTAL-.001);dirty=true;}
function stationIndexAt(x){let k=0;ST.forEach((s,i)=>{if(x>=s.start-.001)k=i;});return k;}
function goStation(i){i=cl(i,0,ST.length-1);seek(ST[i].start+.001);setPlaying(true);}
function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){t+=dt*speed;if(t>=TOTAL){t=TOTAL-.001;playing=false;}dirty=true;}
  if(dirty){frame(t);dirty=false;}
  requestAnimationFrame(tick);
}
cv.addEventListener('click',()=>setPlaying(!playing));
cv.addEventListener('dblclick',e=>{e.preventDefault();toggleFs();});
function toggleFs(){const d=document;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const r=d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen;if(r){const p=r.call(d.documentElement);if(p&&p.catch)p.catch(()=>{});}}}catch(e){}}
document.addEventListener('keydown',e=>{
  const i=stationIndexAt(t);
  if(e.key===' '||e.key==='Enter'){e.preventDefault();setPlaying(!playing);}
  else if(e.key==='ArrowRight'){seek(t+5);}
  else if(e.key==='ArrowLeft'){seek(t-5);}
  else if(e.key==='PageDown'||e.key==='ArrowDown'){e.preventDefault();goStation(i+1);}
  else if(e.key==='PageUp'||e.key==='ArrowUp'){e.preventDefault();goStation(t-ST[i].start<2?i-1:i);}
  else if(e.key==='f'||e.key==='F'){toggleFs();}
  else if(e.key==='Home'){goStation(0);}
});
window.addEventListener('resize',resize);
resize();
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',()=>{dirty=true;});
requestAnimationFrame(tick);
const src=document.getElementById('app').textContent;
const cjk=[...new Set(src.match(/[^\x00-\x7F]/g)||[])].join('')+'ABCabc0123%→';
const specs=['600 40px "Noto Serif SC"','700 40px "Noto Serif SC"','400 40px "Noto Sans SC"','500 40px "Noto Sans SC"','600 40px "Noto Sans SC"','400 40px "IBM Plex Mono"','400 40px "Newsreader"','italic 400 40px "Newsreader"'];
const fontsReady=document.fonts?Promise.all(specs.map(s=>document.fonts.load(s,cjk).catch(()=>{}))):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,3500))]).then(()=>{dirty=true;if(!reduce)setPlaying(true);else{t=ST[0].start+10*K;}});
cv.focus();
})();
</script>
